services:
  pg-primary:
    image: bitnami/postgresql:latest
    ports:
      - "5432:5432"
    environment:
      # --- Replication Configuration ---
      - POSTGRESQL_REPLICATION_MODE=master
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      # --- Synchronous Commit Settings ---
      - POSTGRESQL_SYNCHRONOUS_COMMIT_MODE=off
      - POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS=1
      # --- Application User & Database ---
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_DATABASE=mydb
      # --- Superuser Password ---
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword

      - POSTGRESQL_CLUSTER_APP_NAME=pg_replica_1
    volumes:
      - pg_primary_data:/bitnami/postgresql

  pg-replica:
    image: bitnami/postgresql:latest
    ports:
      - "5433:5432"
    depends_on:
      - pg-primary
    environment:
      # --- Replication Configuration ---
      - POSTGRESQL_REPLICATION_MODE=slave
      - POSTGRESQL_REPLICATION_USER=repl_user
      - POSTGRESQL_REPLICATION_PASSWORD=repl_password
      - POSTGRESQL_MASTER_HOST=pg-primary
      - POSTGRESQL_MASTER_PORT_NUMBER=5432
      - POSTGRESQL_CLUSTER_APP_NAME=pg_replica_1
      - POSTGRESQL_PASSWORD=mypassword
      - POSTGRESQL_USERNAME=myuser
      - POSTGRESQL_DATABASE=mydb
      # --- Superuser Password (optional but good for consistency) ---
      - POSTGRESQL_POSTGRES_PASSWORD=adminpassword
      # Note: 'myuser' and 'mydb' vars are not needed here; 
      # they are copied from primary during startup.
    volumes:
      - pg_replica_data:/bitnami/postgresql

volumes:
  pg_primary_data:
  pg_replica_data:

<!DOCTYPE html>
<html lang="ru">

<head>
      <meta charset="UTF-8">
      <title>Lexical Hub — Reader & Vocabulary</title>
      <style>
            :root {
                  --primary: #2563eb;
                  --primary-light: #eff6ff;
                  --success: #059669;
                  --success-light: #ecfdf5;
                  --warning: #d97706;
                  --warning-light: #fffbeb;
                  --bg: #f8fafc;
                  --card-bg: #ffffff;
                  --text-main: #0f172a;
                  --text-muted: #64748b;
                  --border: #e2e8f0;
            }

            * {
                  box-sizing: border-box;
            }

            body {
                  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                  font-size: 14px;
                  line-height: 1.5;
                  color: var(--text-main);
                  background: var(--bg);
                  max-width: 1000px;
                  margin: 24px auto;
                  padding: 0 20px;
            }

            h1 {
                  font-size: 24px;
                  font-weight: 700;
                  margin: 0 0 20px 0;
            }

            h2 {
                  font-size: 18px;
                  font-weight: 600;
                  margin: 28px 0 14px 0;
            }

            .nav-tabs {
                  display: flex;
                  gap: 8px;
                  margin-bottom: 20px;
                  border-bottom: 2px solid var(--border);
            }

            .tab-btn {
                  background: none;
                  border: none;
                  padding: 10px 16px;
                  font-family: inherit;
                  font-size: 15px;
                  font-weight: 600;
                  color: var(--text-muted);
                  cursor: pointer;
                  border-bottom: 3px solid transparent;
                  margin-bottom: -2px;
            }

            .tab-btn.active {
                  color: var(--primary);
                  border-bottom-color: var(--primary);
            }

            .reader-controls {
                  display: flex;
                  gap: 12px;
                  margin-bottom: 12px;
                  align-items: center;
            }

            select,
            input[type="text"] {
                  padding: 8px 12px;
                  border-radius: 6px;
                  border: 1px solid var(--border);
                  font-family: inherit;
                  font-size: 13.5px;
                  outline: none;
            }

            select:focus,
            input[type="text"]:focus {
                  border-color: var(--primary);
            }

            textarea {
                  width: 100%;
                  height: 150px;
                  padding: 12px 14px;
                  border-radius: 8px;
                  border: 1px solid var(--border);
                  font-family: inherit;
                  font-size: 14px;
                  line-height: 1.6;
                  resize: vertical;
                  outline: none;
            }

            button.btn {
                  font-family: inherit;
                  font-size: 13px;
                  font-weight: 600;
                  padding: 8px 14px;
                  border-radius: 6px;
                  cursor: pointer;
                  border: 1px solid transparent;
                  transition: 0.15s ease;
            }

            .btn-primary {
                  background: var(--primary);
                  color: #fff;
            }

            .btn-primary:hover {
                  background: #1d4ed8;
            }

            .btn-translate {
                  background: var(--primary-light);
                  color: var(--primary);
                  border-color: #bfdbfe;
            }

            .btn-translate:hover {
                  background: var(--primary);
                  color: #fff;
            }

            .btn-learn {
                  background: #f1f5f9;
                  color: #334155;
                  border-color: #cbd5e1;
            }

            .btn-learn:hover {
                  background: #334155;
                  color: #fff;
            }

            .btn-known {
                  background: var(--success-light);
                  color: var(--success);
                  border-color: #a7f3d0;
            }

            .btn-known:hover {
                  background: var(--success);
                  color: #fff;
            }

            .btn-del {
                  background: #fee2e2;
                  color: #b91c1c;
                  border-color: #fecaca;
            }

            .card {
                  background: var(--card-bg);
                  border: 1px solid var(--border);
                  border-radius: 8px;
                  padding: 16px;
                  margin-bottom: 12px;
                  display: grid;
                  grid-template-columns: 1fr 170px;
                  gap: 16px;
            }

            .card.in-dict-learning {
                  border-left: 4px solid var(--warning);
            }

            .card.in-dict-known {
                  border-left: 4px solid var(--success);
                  opacity: 0.85;
            }

            .card-header {
                  display: flex;
                  align-items: center;
                  gap: 8px;
                  margin-bottom: 8px;
            }

            .word-title {
                  font-size: 16px;
                  font-weight: 700;
            }

            .tag {
                  padding: 2px 8px;
                  border-radius: 4px;
                  font-size: 11px;
                  font-weight: 600;
                  text-transform: uppercase;
            }

            .tag-gray {
                  background: #f1f5f9;
                  color: var(--text-muted);
            }

            .tag-learning {
                  background: var(--warning-light);
                  color: var(--warning);
            }

            .tag-known {
                  background: var(--success-light);
                  color: var(--success);
            }

            .context {
                  font-size: 14px;
                  color: var(--text-muted);
                  font-style: italic;
                  line-height: 1.5;
                  margin-bottom: 10px;
            }

            .llm-result-box {
                  background: #f8fafc;
                  border: 1px solid var(--border);
                  border-radius: 6px;
                  padding: 10px 12px;
                  margin-top: 8px;
                  display: flex;
                  flex-direction: column;
                  gap: 6px;
            }

            .translation-text {
                  font-size: 14px;
                  font-weight: 600;
                  color: var(--success);
            }

            .breakdown-text {
                  font-size: 13px;
                  color: #334155;
                  line-height: 1.45;
                  border-top: 1px dashed var(--border);
                  padding-top: 6px;
            }

            .btn-group {
                  display: flex;
                  flex-direction: column;
                  gap: 8px;
            }

            .tab-content {
                  display: none;
            }

            .tab-content.active {
                  display: block;
            }

            table {
                  width: 100%;
                  border-collapse: collapse;
                  background: var(--card-bg);
                  border-radius: 8px;
                  border: 1px solid var(--border);
            }

            th,
            td {
                  padding: 12px 14px;
                  text-align: left;
                  border-bottom: 1px solid var(--border);
                  vertical-align: top;
                  font-size: 13.5px;
            }

            th {
                  background: #f8fafc;
                  font-weight: 600;
                  color: var(--text-muted);
            }

            .vocab-word-block strong {
                  font-size: 15px;
            }

            .vocab-translation {
                  color: var(--success);
                  font-weight: 600;
                  margin-top: 4px;
            }

            .vocab-breakdown {
                  color: var(--text-muted);
                  font-size: 12.5px;
                  margin-top: 4px;
            }

            .context-list {
                  margin: 0;
                  padding-left: 18px;
                  color: var(--text-muted);
                  font-size: 13px;
            }
      </style>
</head>

<body>
      <h1>📖 Lexical Hub</h1>

      <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('tab-reader', this)">Чтение и Анализ</button>
            <button class="tab-btn" onclick="switchTab('tab-vocab', this); loadVocabulary();">📚 Мой Словарик (<span
                        id="dictCount">0</span>)</button>
      </div>

      <!-- Вкладка 1: Анализ -->
      <div id="tab-reader" class="tab-content active">
            <div class="reader-controls">
                  <label><strong>Язык:</strong></label>
                  <select id="readerLanguage" onchange="onLanguageChange()">
                        <option value="es">🇪🇸 Испанский</option>
                        <option value="en">🇬🇧 Английский</option>
                  </select>

                  <label style="margin-left: 12px;"><strong>Источник:</strong></label>
                  <!-- Селектор существующих книг из БД -->
                  <select id="readerSourceSelect" onchange="onReaderSourceSelectChange()" style="max-width: 200px;">
                        <option value="Общее">Общее</option>
                  </select>

                  <!-- Поле для ввода новой книги (скрыто по умолчанию) -->
                  <input type="text" id="readerSourceInput" placeholder="Название новой книги/источника"
                        style="width: 220px; display: none;">
                  <button class="btn btn-learn" id="btnToggleNewSource" type="button" onclick="toggleNewSourceMode()">+
                        Новая книга</button>
            </div>

            <textarea id="inputText" placeholder="Вставьте текст для разбора..."></textarea>
            <button class="btn btn-primary" style="margin-top: 10px;" onclick="analyzeText()">Разобрать текст</button>

            <h2>🎯 Обороты и идиомы</h2>
            <div id="phrasesList">
                  <p style="color: var(--text-muted); font-style: italic;">Вставьте текст и запустите анализ.</p>
            </div>

            <h2>✨ Редкие слова</h2>
            <div id="wordsList">
                  <p style="color: var(--text-muted); font-style: italic;">Список пуст.</p>
            </div>
      </div>

      <!-- Вкладка 2: Словарь -->
      <div id="tab-vocab" class="tab-content">
            <div style="margin-bottom: 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                  <input type="text" id="filterInput" oninput="handleFilterChange()"
                        placeholder="🔍 Поиск по слову/переводу..." style="width: 240px;">

                  <select id="filterLanguage" onchange="handleFilterChange()">
                        <option value="all">🌐 Все языки</option>
                        <option value="es">🇪🇸 Испанский</option>
                        <option value="en">🇬🇧 Английский</option>
                  </select>

                  <select id="filterSource" onchange="handleFilterChange()">
                        <option value="all">📚 Все источники</option>
                  </select>

                  <button class="btn btn-learn" onclick="loadVocabulary()">Обновить</button>
            </div>

            <table>
                  <thead>
                        <tr>
                              <th style="width: 70px;">Язык</th>
                              <th style="width: 80px;">Тип</th>
                              <th style="width: 230px;">Слово / Источник / Разбор</th>
                              <th>Контексты</th>
                              <th style="width: 80px;">Встречено</th>
                              <th style="width: 100px;">Статус</th>
                              <th style="width: 60px;"></th>
                        </tr>
                  </thead>
                  <tbody id="vocabTableBody"></tbody>
            </table>
      </div>
      <div id="loadMoreContainer" style="text-align: center; margin-top: 16px; display: none;">
            <button class="btn btn-learn" id="btnLoadMore" onclick="loadNextPage()">
                  ▼ Загрузить ещё (<span id="loadedCountInfo"></span>)
            </button>
      </div>
      <script src="/static/app.js"></script>
</body>

</html>
